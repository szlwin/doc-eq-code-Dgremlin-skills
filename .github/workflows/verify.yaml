name: verify
'on':
  push: {}
  pull_request: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: dec_ci_local
          MYSQL_DATABASE: dec_test
        ports:
        - 3306:3306
        options: --health-cmd="mysqladmin ping -uroot -pdec_ci_local --silent" --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install DEC skill validators
      run: python -m pip install -r skills/dec-design/requirements.txt -r skills/dec-implementation/requirements.txt
    - name: Verify skill source manifest and script tests
      run: |-
        python skills/dec-design/scripts/check_manifest.py
        python skills/dec-implementation/scripts/check_manifest.py
        python -m unittest discover -s skills/dec-design/tests -p 'test_*.py'
        python -m unittest discover -s skills/dec-implementation/tests -p 'test_*.py'
        python skills/dec-design/evals/check_manifest.py
        python skills/dec-implementation/evals/check_manifest.py
        python -m unittest discover -s skills/dec-design/evals -p 'test_*.py'
        python -m unittest discover -s skills/dec-implementation/evals -p 'test_*.py'
    - name: Validate canonical demo and binding
      run: |-
        python skills/dec-design/scripts/validate_dec_yaml.py demo/order-payment-yaml
        python skills/dec-implementation/scripts/validate_binding.py --design demo/order-payment-yaml --binding demo/order-payment-implementation-binding.yaml --project-root demo/order-payment-app --require-complete --require-tests --require-symbols
    - name: Check derived XML and HTML drift
      run: |-
        python skills/dec-design/scripts/yaml_to_xml.py demo/order-payment-yaml -o /tmp/dec-demo-xml --emit-id-comments
        python skills/dec-design/scripts/render_dec_graph.py demo/order-payment-yaml -o /tmp/dec-demo-html
        diff -qr --exclude=.DS_Store demo/order-payment-xml /tmp/dec-demo-xml
        diff -qr --exclude=.DS_Store demo/design-html /tmp/dec-demo-html
        diff -qr --exclude=.DS_Store demo/order-payment-xml demo/order-payment-app/src/main/resources/dec/design
    - name: Verify reactor, MySQL behavior and release artifacts
      env:
        DEC_MYSQL_JDBC_URL: jdbc:mysql://127.0.0.1:3306/dec_test?allowPublicKeyRetrieval=true&useSSL=false
        DEC_MYSQL_USER: root
        DEC_MYSQL_PASSWORD: dec_ci_local
      run: ./dec-java-lite/mvnw -B -f dec-java-lite/pom.xml clean install -Prelease-artifacts,mysql-it
    - name: Verify cross-domain expense approval fixture
      run: |-
        python skills/dec-design/scripts/validate_dec_yaml.py dec-java-lite/fixtures/expense-approval
        python skills/dec-design/scripts/yaml_to_xml.py dec-java-lite/fixtures/expense-approval -o /tmp/dec-expense-xml --emit-id-comments
        diff -qr --exclude=.DS_Store dec-java-lite/examples/expense-approval/generated/src/main/resources/dec/design /tmp/dec-expense-xml
        ./dec-java-lite/mvnw -B -f dec-java-lite/examples/expense-approval/generated/pom.xml test
    - name: Verify configurable API grouping
      run: |-
        dec_cli_jar=$(python3 - <<'PYCLI'
        from pathlib import Path
        jars = sorted(p for p in Path('dec-java-lite/dec-lite-cli/target').glob('dec-lite-cli-*.jar')
                      if not p.name.endswith(('-sources.jar', '-javadoc.jar', '-tests.jar')))
        if len(jars) != 1:
            raise SystemExit(f'需要唯一 CLI jar，实际找到 {len(jars)} 个；请核对构建结果和旧版本残留')
        print(jars[0])
        PYCLI
        )
        java -jar "$dec_cli_jar" generate --yaml demo/order-payment-yaml --output /tmp/dec-configured-demo --base-package com.example.orderpayment --generation-config demo/order-payment-generation.properties
        ./dec-java-lite/mvnw -B -f /tmp/dec-configured-demo/pom.xml test
    - name: Verify generated Spring wiring, API regrouping and packaged XML
      env:
        DEC_MYSQL_JDBC_URL: jdbc:mysql://127.0.0.1:3306/dec_test?allowPublicKeyRetrieval=true&useSSL=false
        DEC_MYSQL_USER: root
        DEC_MYSQL_PASSWORD: dec_ci_local
      run: python3 dec-java-lite/tools/verify_generated_projects.py
    - name: Archive generated project smoke evidence
      uses: actions/upload-artifact@v4
      with:
        name: dec-generated-project-smoke
        path: dec-java-lite/target/generated-project-smoke
        if-no-files-found: error
    - name: Test demo and verify current Binding evidence
      env:
        DEC_DB_URL: jdbc:mysql://127.0.0.1:3306/dec_test?allowPublicKeyRetrieval=true&useSSL=false
        DEC_DB_USERNAME: root
        DEC_DB_PASSWORD: dec_ci_local
      run: |-
        python skills/dec-implementation/scripts/run_binding_verification.py --design demo/order-payment-yaml --binding demo/order-payment-implementation-binding.yaml --project-root demo/order-payment-app --input ../../dec-java-lite --input ../../skills/dec-implementation --input ../order-payment-generation.properties -- ../../dec-java-lite/mvnw -B clean test
        python skills/dec-implementation/scripts/validate_binding.py --design demo/order-payment-yaml --binding demo/order-payment-implementation-binding.yaml --project-root demo/order-payment-app --require-ready
    - name: Archive Binding verification evidence
      uses: actions/upload-artifact@v4
      with:
        name: dec-binding-evidence
        path: |-
          demo/order-payment-app/target/dec-binding-evidence.json
          demo/order-payment-app/target/surefire-reports/TEST-*.xml
        if-no-files-found: error
  generator-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Verify Windows manifest regeneration and ownership protection
      shell: pwsh
      run: .\dec-java-lite\mvnw.cmd -B -f dec-java-lite/pom.xml -pl dec-lite-generator -am test "-Dtest=GeneratedProjectWriterTest,GenerationOptionsTest"
        "-Dsurefire.failIfNoSpecifiedTests=false"
