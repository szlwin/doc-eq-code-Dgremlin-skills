- designId: BUS-ORDER-PAYMENT
  strategy: REUSE
  status: VERIFIED
  notes: Executed by DEC Runtime. One OrderPaymentListener binds BUS-ORDER-PAYMENT and receives all executed Action events,
    including success/error branches and Back Actions. Duplicate flow listener registration is rejected. Listener typed View
    snapshots reuse the flow ModelCodec. Named DEC DataSource implementations are manually injected and selected by logical
    source per execution; this does not reroute application DAO/JDBC resources. Current-stage business queries use BusinessQueryRuntime
    with canonical Information/RuleViews, declared relations and Spring-owned JDBC reads; OrderQueryExamples demonstrates
    find/eq/start/end/with without status-code lists.
  tests:
  - module: order-payment-app
    file: src/test/java/com/example/orderpayment/demo/OrderWorkflowTest.java
    symbol: OrderWorkflowTest
  - module: order-payment-app
    file: src/test/java/com/example/orderpayment/demo/OrderWorkflowTest.java
