kind: api
version: dec/v1
apis:
- id: API-ORDER-SUBMIT
  name: submitOrder
  desc: 提交订单
  system: order
  url: /api/orders/{orderId}/submit
  method: POST
  request:
    params:
    - id: API-PARAM-ORDER-ID
      name: orderId
      in: path
      type: long
      required: true
      desc: 订单 ID
      validations:
      - type: notNull
      - type: min
        value: 1
      - type: max
        value: 999999999
    - id: API-PARAM-REMARK
      name: remark
      in: body
      type: string
      required: false
      desc: 订单备注
      validations:
      - type: maxLength
        value: 500
      - type: regex
        value: ^[A-Za-z0-9 _.,-]{0,500}$
    - id: API-PARAM-STATUS
      name: status
      in: body
      type: int
      required: true
      desc: 订单状态
      relEnum: OrderStatus
    - id: API-PARAM-TYPE
      name: type
      in: body
      type: int
      required: true
      desc: 订单类型
      relEnum: OrderType
    - id: API-PARAM-USER-ID
      name: userId
      in: body
      type: int
      required: true
      validations:
      - type: min
        value: 1
    - id: API-PARAM-PRODUCT-ID
      name: productId
      in: body
      type: int
      required: true
      validations:
      - type: min
        value: 1
    - id: API-PARAM-PRODUCT-NAME
      name: productName
      in: body
      type: string
      required: true
      validations:
      - type: minLength
        value: 1
      - type: maxLength
        value: 120
    - id: API-PARAM-PRODUCT-PRICE
      name: productPrice
      in: body
      type: decimal
      required: true
      validations:
      - type: min
        value: 1
    - id: API-PARAM-PRODUCT-COUNT
      name: productCount
      in: body
      type: int
      required: true
      validations:
      - type: min
        value: 1
    validations:
    - type: expression
      expression: status = 1 and type = 1
      message: status 与 type 组合不满足接口约束
  response:
    type: object
    desc: 提交后的订单摘要
    modelRef: OrderInfo
    fields:
    - name: id
      type: long
      required: true
      desc: 订单 ID
    - name: status
      type: int
      required: true
      desc: 当前订单状态
      relEnum: OrderStatus
- id: API-ORDER-START-PAYMENT
  name: startPayment
  desc: 发起支付
  system: order
  url: /api/orders/{orderId}/payment
  method: POST
  request:
    params:
    - name: orderId
      in: path
      type: long
      required: true
      validations:
      - type: min
        value: 1
      - type: max
        value: 999999999
      id: API-PARAM-STARTPAYMENT-ORDER-ID
  response:
    type: object
    modelRef: OrderInfo
    fields:
    - name: id
      type: long
      required: true
    - name: status
      type: int
      required: true
      relEnum: OrderStatus
- id: API-ORDER-RECEIVE-PAYMENT-RESULT
  name: receivePaymentResult
  desc: 接收支付结果
  system: order
  url: /api/orders/{orderId}/payment/result
  method: POST
  request:
    params:
    - name: orderId
      in: path
      type: long
      required: true
      validations:
      - type: min
        value: 1
      - type: max
        value: 999999999
      id: API-PARAM-RECEIVEPAYMENTRESULT-ORDER-ID
    - id: API-PARAM-PAY-RESULT-CODE
      name: resultCode
      in: body
      type: string
      required: true
      relEnum: PayResultCode
  response:
    type: object
    modelRef: OrderInfo
    fields:
    - name: id
      type: long
      required: true
    - name: status
      type: int
      required: true
      relEnum: OrderStatus
- id: API-ORDER-BACK-TO-PAYING
  name: backToPaying
  desc: 支付结果回退到支付中
  system: order
  url: /api/orders/{orderId}/payment/back
  method: POST
  request:
    params:
    - name: orderId
      in: path
      type: long
      required: true
      validations:
      - type: min
        value: 1
      - type: max
        value: 999999999
      id: API-PARAM-BACKTOPAYING-ORDER-ID
  response:
    type: object
    modelRef: OrderInfo
    fields:
    - name: id
      type: long
      required: true
    - name: status
      type: int
      required: true
      relEnum: OrderStatus
- id: API-ORDER-GET
  name: getOrder
  desc: 查询订单和支付状态
  system: order
  url: /api/orders/{orderId}
  method: GET
  request:
    params:
    - name: orderId
      in: path
      type: long
      required: true
      validations:
      - type: min
        value: 1
      - type: max
        value: 999999999
      id: API-PARAM-GETORDER-ORDER-ID
  response:
    type: object
    modelRef: OrderInfo
    fields:
    - name: id
      type: long
      required: true
    - name: status
      type: int
      required: true
      relEnum: OrderStatus
