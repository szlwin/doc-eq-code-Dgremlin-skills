kind: api
version: dec/v1
apis:
- id: API-ORDER-SUBMIT
  name: submitOrder
  desc: 提交订单
  system: order
  url: /api/orders/{orderId}/submit
  method: POST
  request:
    params:
    - id: API-PARAM-ORDER-ID
      name: orderId
      in: path
      type: long
      required: true
      desc: 订单 ID
      validations:
      - type: notNull
        message: 订单 ID不能为空
      - type: min
        value: 1
        message: 订单 ID最小为1
      - type: max
        value: 999999999
        message: 订单 ID最大为999999999
    - id: API-PARAM-REMARK
      name: remark
      in: body
      type: string
      required: false
      desc: 订单备注
      validations:
      - type: maxLength
        value: 500
        message: 订单备注长度最大为500
      - type: regex
        value: ^[A-Za-z0-9 _.,-]{0,500}$
        message: 订单备注格式不正确
    - id: API-PARAM-STATUS
      name: status
      in: body
      type: int
      required: true
      desc: 订单状态
      relEnum: OrderStatus
    - id: API-PARAM-TYPE
      name: type
      in: body
      type: int
      required: true
      desc: 订单类型
      relEnum: OrderType
    - id: API-PARAM-USER-ID
      name: userId
      in: body
      type: int
      required: true
      validations:
      - type: min
        value: 1
        message: 用户 ID最小为1
      desc: 用户 ID
    - id: API-PARAM-PRODUCT-ID
      name: productId
      in: body
      type: int
      required: true
      validations:
      - type: min
        value: 1
        message: 产品 ID最小为1
      desc: 产品 ID
    - id: API-PARAM-PRODUCT-NAME
      name: productName
      in: body
      type: string
      required: true
      validations:
      - type: minLength
        value: 1
        message: 产品名称长度最小为1
      - type: maxLength
        value: 120
        message: 产品名称长度最大为120
      desc: 产品名称
    - id: API-PARAM-PRODUCT-PRICE
      name: productPrice
      in: body
      type: decimal
      required: true
      validations:
      - type: min
        value: 1
        message: 产品价格最小为1元
      desc: 产品价格
    - id: API-PARAM-PRODUCT-COUNT
      name: productCount
      in: body
      type: int
      required: true
      validations:
      - type: min
        value: 1
        message: 产品数量最小为1
      desc: 产品数量
  response:
    type: object
    desc: 提交后的订单摘要
    modelRef: OrderInfo
    fields:
    - name: id
      type: long
      required: true
      desc: 订单 ID
    - name: status
      type: int
      required: true
      desc: 当前订单状态
      relEnum: OrderStatus
- id: API-ORDER-START-PAYMENT
  name: startPayment
  desc: 发起支付
  system: order
  url: /api/orders/{orderId}/payment
  method: POST
  request:
    params:
    - name: orderId
      in: path
      type: long
      required: true
      validations:
      - type: min
        value: 1
      - type: max
        value: 999999999
      id: API-PARAM-STARTPAYMENT-ORDER-ID
  response:
    type: object
    modelRef: OrderInfo
    fields:
    - name: id
      type: long
      required: true
    - name: status
      type: int
      required: true
      relEnum: OrderStatus
- id: API-ORDER-RECEIVE-PAYMENT-RESULT
  name: receivePaymentResult
  desc: 接收支付结果
  system: order
  url: /api/orders/{orderId}/payment/result
  method: POST
  request:
    params:
    - name: orderId
      in: path
      type: long
      required: true
      validations:
      - type: min
        value: 1
      - type: max
        value: 999999999
      id: API-PARAM-RECEIVEPAYMENTRESULT-ORDER-ID
    - id: API-PARAM-PAY-RESULT-CODE
      name: resultCode
      in: body
      type: int
      required: true
      relEnum: PayResultCode
  response:
    type: object
    modelRef: OrderInfo
    fields:
    - name: id
      type: long
      required: true
    - name: status
      type: int
      required: true
      relEnum: OrderStatus
- id: API-ORDER-BACK-TO-PAYING
  name: backToPaying
  desc: 支付结果回退到支付中
  system: order
  url: /api/orders/{orderId}/payment/back
  method: POST
  request:
    params:
    - name: orderId
      in: path
      type: long
      required: true
      validations:
      - type: min
        value: 1
      - type: max
        value: 999999999
      id: API-PARAM-BACKTOPAYING-ORDER-ID
  response:
    type: object
    modelRef: OrderInfo
    fields:
    - name: id
      type: long
      required: true
    - name: status
      type: int
      required: true
      relEnum: OrderStatus
- id: API-ORDER-GET
  name: getOrder
  desc: 查询订单和支付状态
  system: order
  url: /api/orders/{orderId}
  method: GET
  request:
    params:
    - name: orderId
      in: path
      type: long
      required: true
      validations:
      - type: min
        value: 1
      - type: max
        value: 999999999
      id: API-PARAM-GETORDER-ORDER-ID
  response:
    type: object
    modelRef: OrderInfo
    fields:
    - name: id
      type: long
      required: true
    - name: status
      type: int
      required: true
      relEnum: OrderStatus
- id: API-ORDER-QUERY
  name: queryOrders
  desc: 按当前业务阶段查询订单，支持阶段分类、闭区间、关联用户和分页
  system: order
  url: /api/orders
  method: GET
  request:
    params:
    - id: API-PARAM-QUERY-EQ
      name: eq
      in: query
      type: string
      required: false
      desc: 精确业务阶段，与 start/end 互斥
      validations:
      - type: minLength
        value: 1
        message: eq长度不能小于1
      - type: maxLength
        value: 256
        message: eq长度不能大于256
    - id: API-PARAM-QUERY-START
      name: start
      in: query
      type: string
      required: false
      desc: 范围起点，包含起点
      validations:
      - type: minLength
        value: 1
        message: start长度不能小于1
      - type: maxLength
        value: 256
        message: start长度不能大于256
    - id: API-PARAM-QUERY-END
      name: end
      in: query
      type: string
      required: false
      desc: 范围终点，包含终点
      validations:
      - type: minLength
        value: 1
        message: end长度不能小于1
      - type: maxLength
        value: 256
        message: end长度不能大于256
    - id: API-PARAM-QUERY-WITH
      name: with
      in: query
      type: string
      required: false
      desc: 关联名称，多个名称用逗号分隔
      validations:
      - type: minLength
        value: 1
        message: with长度不能小于1
      - type: maxLength
        value: 256
        message: with长度不能大于256
    - id: API-PARAM-QUERY-OFFSET
      name: offset
      in: query
      type: int
      required: false
      desc: 根订单偏移量，省略时使用查询框架默认值 0
      validations:
      - type: min
        value: 0
        message: offset不能小于0
      - type: max
        value: 99999
        message: offset不能大于99999
    - id: API-PARAM-QUERY-SIZE
      name: size
      in: query
      type: int
      required: false
      desc: 每页订单数，省略时使用查询框架默认值 50
      validations:
      - type: min
        value: 1
        message: size不能小于1
      - type: max
        value: 500
        message: size不能大于500
  response:
    type: array
    modelRef: OrderInfo
    desc: 当前页订单 View 数组；关联用户仅在 with 指定时加载
  notes: 选择器使用 Directory 名称、Design ID 或明确注册的中文别名；eq 与 start/end 互斥。未知阶段、关联或不可达范围返回 400。仅查询当前事实，不查询历史经历。
