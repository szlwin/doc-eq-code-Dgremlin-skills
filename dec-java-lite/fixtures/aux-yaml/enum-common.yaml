    value: 0
    name: INIT
    desc: 初始化
  - id: ENUM-VALUE-PAYMENT-STATUS-PROCESSING
    value: 1
    name: PROCESSING
    desc: 处理中
- id: ENUM-PAY-RESULT-CODE
  name: PayResultCode
  desc: 支付结果
  values:
