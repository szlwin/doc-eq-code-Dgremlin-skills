    value: 1
    name: WAIT_PAY
    desc: 待支付
  - id: ENUM-VALUE-ORDER-STATUS-PAYING
    value: 2
    name: PAYING
    desc: 支付中
  - id: ENUM-VALUE-ORDER-STATUS-SUCCESS
    value: 3
    name: PAY_SUCCESS
    desc: 支付成功
  - id: ENUM-VALUE-ORDER-STATUS-ERROR
    value: 4
    name: PAY_ERROR
    desc: 支付失败
- id: ENUM-ORDER-TYPE
  name: OrderType
  desc: 订单类型
  values:
