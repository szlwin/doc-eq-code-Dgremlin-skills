    value: 1
    name: NORMAL
    desc: 普通订单
  - id: ENUM-VALUE-ORDER-TYPE-PREORDER
    value: 2
    name: PREORDER
    desc: 预售订单
- id: ENUM-PAYMENT-STATUS
  name: PaymentStatus
  desc: 支付状态
  values:
