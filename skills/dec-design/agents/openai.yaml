interface:
  display_name: "DEC Design"
  short_description: "按 DEC 字段级规范编写 canonical YAML/API/Enum，校验引用并生成兼容 XML"
  default_prompt: "使用 $dec-design 将已确认需求和业务流程建模为 DEC canonical YAML。开始写 YAML 前先读取 references/source-basis.md、references/input-and-source-boundaries.md 与 references/dec-yaml-spec.md 索引，再按需读取 references/yaml-spec/common.md + 当前 kind 分片和对应 templates/<kind>.yaml；先识别 canonical、legacy、XML 和 HTML recovery artifact，禁止把展示工件当设计源，也不得凭字段名猜 grammar。所有 YAML/XML 读写必须走 Skill 脚本：YAML 用 scripts/yaml_io.py read/write/merge，XML 读取/首次迁移用 scripts/xml_to_yaml.py，用户/外部系统修改 XML 后回流 existing YAML 必须用 scripts/sync_xml_to_yaml.py，XML 写入只用 scripts/yaml_to_xml.py；禁止直接打开、编辑或 ad-hoc 解析 YAML/XML。YAML 是唯一权威设计源，XML 只能由 scripts/yaml_to_xml.py 生成；若任务是首次迁移已有 DEC XML，则按需读取 references/xml-to-yaml.md 并使用 scripts/xml_to_yaml.py；若是外部 XML 变更同步，读取 references/xml-yaml-sync.md 并使用 scripts/sync_xml_to_yaml.py，保留 YAML-only metadata/Design ID、对删除和歧义 rename fail closed；两种场景完成后都继续以 YAML 为准。完成目录级 validate_dec_yaml、YAML→XML check，并检查 RuleView/Rule dataSource、RuleView code/desc、Enum/relEnum、API required/min/max/length/regex/enum/expression。若需要 HTML 设计文档，只能使用 scripts/render_dec_graph.py 生成并允许覆盖旧生成文件，禁止手工维护 HTML；Information 依赖方向必须为 dependent → prerequisite，所有设计引用应生成可跳转链接。最后报告 DESIGN_GAP、Compiler/Runtime 验证状态和实现交接 Design IDs。"
