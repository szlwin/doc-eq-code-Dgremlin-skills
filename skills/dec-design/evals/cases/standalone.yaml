    仅使用当前安装的 Skill，为公共枚举 expenseStatus 建立 design/enum.yaml：id=ENUM-EXPENSE-STATUS，值0名称draft、值1名称submitted、值2名称approved，均为整数值。请校验并导出到 export/；不要依赖主仓库路径或另一 Skill。
    请使用已安装的 dec-design Skill，在当前工作区内完成。不要调用其他项目 Skill。
context:
