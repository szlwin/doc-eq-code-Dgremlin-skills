kind: business
version: dec/v1
business:
  id: BUS-<NAME>
  name: <businessName>
  desc: <business description>
  directories:
  - id: DIR-ROOT
    name: <rootDirectory>
    informationRef: <system.information>
    modelRef: <ViewName>
    isRoot: true
    actions:
    - id: ACT-<NAME>
      name: <actionName>
      systemRef: <systemName>
      ruleRef: <ruleViewName>
      produces:
      - id: PROD-<NAME>
        ref: <producedDataOrModelNode>
        informationRef: <system.information>
      dataSource: <actionDataSourceName>
  - id: DIR-NEXT
    name: <nextDirectory>
    informationRef: <system.information>
    modelRef: <ViewName>
    subDirectories:
    - rel: <rootDirectory>
    dependencies:
    - informationRef: <system.information>
    actions:
    - id: ACT-CUSTOM
      name: <customActionName>
    change:
      informationRef: <system.materializableInformation>
  - id: DIR-RESULT
    name: <resultDirectory>
    type: result
    informationRef: <system.hasResult>
    modelRef: <ViewName>
    subDirectories:
    - rel: <previousDirectory>
      back:
        name: <backName>
        actions:
        - name: <backActionName>
          systemRef: <systemName>
          ruleRef: <ruleViewName>
    - rel: <successDirectory>
      role: case
      informationRef: <system.success>
    - rel: <errorDirectory>
      role: case
      informationRef: <system.error>
  dataSource: <defaultDataSourceName>
