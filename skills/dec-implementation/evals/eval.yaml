schema_version: v1alpha1
environment:
  type: none
skills:
- source: local_path
  path: .
engine:
  name: codex
cases:
  files:
  - evals/cases/design-gap.yaml
  - evals/cases/runtime-gap.yaml
  - evals/cases/evidence-boundary.yaml
  defaults:
    timeout_seconds: 600
    max_turns: 30
    collect_artifacts:
    - design/**
    - export/**
    - '*.json'
    - '*.yaml'
  parallelism: 1
  retry_policy:
    max_retries: 0
benchmark:
  enabled: false
report:
  formats:
  - json
  - html
  artifacts:
  - transcript
